# Only Traefik routes to this service; preserve its original HTTPS scheme.
map $http_x_forwarded_proto $original_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location ~ ^/media/mwc26/css/pretalx-custom[^/]*\.css$ {
        root /theme;
        try_files /mwc26/pretalx-custom.css =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /media/mwc26/css/fonts/ {
        alias /theme/mwc26/fonts/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /public/media/;
        expires 7d;
        access_log off;
        # Never render HTML, SVG or JavaScript uploads as executable content.
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            application/pdf pdf;
            text/plain txt csv md html htm xhtml svg js mjs xml;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /public/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://pretalx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
    }
}
