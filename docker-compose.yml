# Pretalx Docker Compose for Coolify
# Deploy this repo directly in Coolify - it handles SSL/Proxy via Traefik
#
# Architecture: Traefik -> Nginx (static files) -> Gunicorn (app)
# Nginx serves /media/ and /static/ from the shared volume,
# everything else is proxied to the Pretalx Gunicorn backend.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      - pretalx
    volumes:
      - pretalx-public:/public:ro
    expose:
      - "80"

  pretalx:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - db
    environment:
      # Preserve the actual SQLite store; PostgreSQL was never used by this app.
      PRETALX_DATA_DIR: /data
      PRETALX_DB_TYPE: sqlite3
      PRETALX_DB_NAME: /data/db.sqlite3
      PRETALX_FILESYSTEM_MEDIA: /public/media
      PRETALX_FILESYSTEM_STATIC: /public/static

      # Site configuration - set via Coolify Environment Variables
      PRETALX_SITE_URL: https://${PRETALX_DOMAIN:-localhost}
      PRETALX_DEBUG: ${PRETALX_DEBUG:-False}
      PRETALX_HTTPS: "True"
      # Verified chain: Traefik -> nginx -> Pretalx; no public Gunicorn port.
      PRETALX_TRUSTED_PROXY_COUNT: "2"

      # Correct vendor variable name. Keep DB-backed sessions during the upgrade.
      PRETALX_REDIS: redis://redis:6379/0
      PRETALX_REDIS_SESSIONS: "false"
      PRETALX_CELERY_BACKEND: redis://redis:6379/1
      PRETALX_CELERY_BROKER: redis://redis:6379/2

      # Mail settings
      PRETALX_MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      PRETALX_MAIL_HOST: ${MAIL_HOST:-localhost}
      PRETALX_MAIL_PORT: ${MAIL_PORT:-25}
      PRETALX_MAIL_USER: ${MAIL_USER:-}
      PRETALX_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      PRETALX_MAIL_TLS: ${MAIL_TLS:-False}
      PRETALX_MAIL_SSL: ${MAIL_SSL:-False}

      # Gunicorn tuning
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    volumes:
      - pretalx-data:/data
      - pretalx-public:/public
    expose:
      - "80"

  # Legacy unused database is retained, not deleted or switched into service.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pretalx-database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: pretalx
      POSTGRES_DB: pretalx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - pretalx-redis:/data

volumes:
  pretalx-database:
  pretalx-data:
  pretalx-public:
  pretalx-redis:
