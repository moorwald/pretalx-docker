server {
    listen 80;
    server_name _;
    location ~ "^/media/mwc-maint-[0-9a-f]{32}\.cms$" {
        root /public;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }
    location / {
        default_type text/plain;
        add_header Retry-After "300" always;
        return 503 "Pretalx is temporarily unavailable for a controlled update. Please try again shortly.\n";
    }
}
